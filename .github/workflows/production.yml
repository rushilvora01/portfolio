name: Build deployment for production environment

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: "16.13.0"

      - name: Build and Deploy React App Production to S3
        run: |
          export NODE_OPTIONS=--max_old_space_size=4096
          npm install && npm run build 
          aws s3 sync build s3://rushil-portfolio --delete
          aws cloudfront create-invalidation --distribution-id E2J2M5ZQX8WUSN --paths "/*"
